[package]
name = "run_code_rmcp"
description = "云函数服务,执行JS/TS/Python语言代码,脚本必须有约定的函数名称(handler/main),会调用约定的函数名称结果和日志返回."
version = "0.0.36"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nuwax-ai/run_code_rmcp"
homepage = "https://nuwax.com/"
readme = "README.md"
default-run = "run_code_rmcp"

[features]
default = []
mcp = ["dep:rmcp"]

[dependencies]
tokio = { version = "1.52", features = [
    "fs",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "io-util",
    "process",
    "time",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rmcp = { version = "0.17", features = [
    "server",
    "client",
    "transport-io",
    "transport-async-rw",
    "macros",
], optional = true }
tempfile = "3.27"
regex = "1.12"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
pest = { version = "2.8", features = ["pretty-print"] }
pest_derive = "2.8"
blake3 = "1.8"
pin-project = "1.1"
libc = "0.2"
once_cell = "1.21"
schemars = "1.2"
async-trait = "0.1"

[[bin]]
name = "script_runner"
path = "src/script_runner.rs"
required-features = ["mcp"]
